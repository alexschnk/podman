http:
  routers:
    uptime-kuma:
      entryPoints:
        - "https"
      rule: "Host(`uptime-kuma.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@file
      tls: {}
      service: uptime-kuma

  services:
    uptime-kuma:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8085"            # Change IP Address to your proxmox instance
        passHostHeader: true
