http:
 #region routers 
  routers:
    adguardhome:
      entryPoints:
        - "https"
      rule: "Host(`adguardhome.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: adguardhome

  services:
    adguardhome:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"            # Change IP Address to your proxmox instance
        passHostHeader: true
