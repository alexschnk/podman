http:
  routers:
    pannel:
      entryPoints:
        - "https"
      rule: "Host(`pannel.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: pannel

  services:
    pannel:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8081"            # Change IP Address to your proxmox instance
        passHostHeader: true

