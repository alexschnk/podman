http:
  routers:
    cockpit:
      entryPoints:
        - "https"
      rule: "Host(`cockpit.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: cockpit

  services:
    cockpit:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9090"            # Change IP Address to your proxmox instance
        passHostHeader: true
