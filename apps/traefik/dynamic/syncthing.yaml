http:
  routers:
    syncthing:
      entryPoints:
        - "https"
      rule: "Host(`syncthing.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@file
      tls: {}
      service: syncthing

  services:
    syncthing:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8089"            # Change IP Address to your proxmox instance
        passHostHeader: true
