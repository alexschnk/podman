http:
  routers:
    grafana:
      entryPoints:
        - "https"
      rule: "Host(`grafana.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: grafana

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8091"            # Change IP Address to your proxmox instance
        passHostHeader: true
