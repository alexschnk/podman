http:
 #region routers 
  routers:
    metube:
      entryPoints:
        - "https"
      rule: "Host(`metube.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@file
      tls: {}
      service: metube

  services:
    metube:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8083"            # Change IP Address to your proxmox instance
        passHostHeader: true
