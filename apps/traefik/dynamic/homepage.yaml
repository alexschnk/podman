http:
  routers:
    homepage:
      entryPoints:
        - "https"
      rule: "Host(`homepage.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@file
      tls: {}
      service: homepage

  services:
    homepage:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8088"            # Change IP Address to your proxmox instance
        passHostHeader: true
