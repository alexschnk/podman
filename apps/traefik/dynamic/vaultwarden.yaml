http:

  routers:
    vaultwarden:
      entryPoints:
        - "https"
      rule: "Host(`vaultwarden.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: vaultwarden


  services:

    vaultwarden:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8094"            # Change IP Address to your proxmox instance
        passHostHeader: true
        
