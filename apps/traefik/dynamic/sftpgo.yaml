http:

  routers:
    sftpgo:
      entryPoints:
        - "https"
      rule: "Host(`sftpgo.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: sftpgo

    webdav:
      entryPoints:
        - "https"
      rule: "Host(`webdav.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: webdav


  services:

    sftpgo:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8092"            # Change IP Address to your proxmox instance
        passHostHeader: true
        
    webdav:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8093"            # Change IP Address to your proxmox instance
        passHostHeader: true
