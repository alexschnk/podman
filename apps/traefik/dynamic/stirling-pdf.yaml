http:
  routers:
    stirling-pdf:
      entryPoints:
        - "https"
      rule: "Host(`stirling-pdf.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@file
      tls: {}
      service: stirling-pdf

  services:
    stirling-pdf:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8084"            # Change IP Address to your proxmox instance
        passHostHeader: true
