http:
  routers:
    victoria-metrics:
      entryPoints:
        - "https"
      rule: "Host(`victoria-metrics.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@file
      tls: {}
      service: victoria-metrics

  services:
    victoria-metrics:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8090"            # Change IP Address to your proxmox instance
        passHostHeader: true
